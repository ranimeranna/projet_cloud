
spring.application.name=backend

server.port=8080

# sslmode=disable: avoids SSL negotiation issues with local Docker PostgreSQL
# Port 5433: local Windows PostgreSQL 18 occupies 5432, Docker maps its container port 5432 to host port 5433
spring.datasource.url=jdbc:postgresql://localhost:5433/grouptask?sslmode=disable
spring.datasource.username=grouptask
spring.datasource.password=motdepasse123

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
